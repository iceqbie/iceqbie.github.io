# Keep the photo strip on Home and /photos/ in "most popular" order.
# Needs the repository secret UNSPLASH_ACCESS_KEY (see README → Photos).
name: Update Unsplash photos

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 12:17 JST
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: unsplash
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch popular photos
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python3 tools/fetch-unsplash.py

      - name: Commit if the list changed
        id: commit
        run: |
          if git diff --quiet -- data/photos.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/photos.json
          git commit -m "Update Unsplash photos (most popular first)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not start the Pages build by
      # itself, so ask for one.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
